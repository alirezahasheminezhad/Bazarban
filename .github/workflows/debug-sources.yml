name: debug-sources
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        shell: bash {0}
        run: |
          UA="Mozilla/5.0 (compatible; BazarbanBot/1.0; +https://github.com/alirezahasheminezhad/Bazarban)"
          curl -sS -m 20 -A "$UA" "https://govisaviya.lk/api/prices/homepage?more=1" -o /tmp/h.json
          python3 -c "import json;d=json.load(open('/tmp/h.json'));r=d['data'];print(len(r),list(d.keys()));print(json.dumps(r[0]));print([x['item'] for x in r])"
          python3 -c "import json;d=json.load(open('/tmp/h.json'))['data'];print([json.dumps(x) for x in d if any(k in x['item'].lower() for k in ('pepper','ginger','turmeric','chill','cinnamon','cardamom','clove','nutmeg','capsicum'))])"
