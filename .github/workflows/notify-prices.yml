name: Send prices to bots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazarban-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore latest data.json from the data branch (main's copy is stale)
        run: |
          git fetch --depth=1 origin data 2>/dev/null && git show FETCH_HEAD:data.json > data.json || echo "no data branch yet; using data.json from main"
      - run: python -m pip install --disable-pip-version-check requests tzdata
      - run: python notify.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
