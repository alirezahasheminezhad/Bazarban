name: Send prices to bots

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Bazarban prices"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: bazarban-notify
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check requests
      - run: python notify.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
