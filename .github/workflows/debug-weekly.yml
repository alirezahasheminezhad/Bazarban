name: Debug weekly PDF (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  dbg:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 tzdata pypdf
      - run: |
          python - <<'PY'
          from io import BytesIO
          import requests
          from pypdf import PdfReader
          import world_prices as w
          url = "https://www.indianspices.com/admin/international_weekly_price/upload/07.11.2026%20dmfmt.pdf"
          r = requests.get(url, headers=w.HEADERS, timeout=60)
          rd = PdfReader(BytesIO(r.content))
          print("PAGES", len(rd.pages))
          for pg in rd.pages:
              print("=== LAYOUT")
              for l in pg.extract_text(extraction_mode="layout").splitlines():
                  if l.strip(): print("LY", repr(l))
          PY
