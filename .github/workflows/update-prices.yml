name: Update Bazarban prices

on:
  workflow_dispatch: # triggered every 5 min by cron-job.org; GitHub's own cron is unreliable

permissions:
  contents: write

concurrency:
  group: bazarban-price-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Restore previous data (history) from the data branch
        run: |
          git fetch --depth=1 origin data 2>/dev/null && git show FETCH_HEAD:data.json > data.json || echo "no data branch yet; using data.json from main"
      - name: Fetch NCDEX prices and USD/Toman, then build data.json
        id: fetch
        run: python fetch_prices.py
      - name: Fetch currency and gold prices (same run; a failure here must not stop the spice update)
        if: ${{ steps.fetch.outcome == 'success' }}
        continue-on-error: true
        run: python fx_prices.py
      - name: Publish data.json to the data branch (single commit, no history growth)
        run: |
          d=$(mktemp -d)
          cp data.json "$d/"
          cd "$d"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -q -m "Prices $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      # Same job as the fetch: a separate workflow_run job was skipped or delayed by GitHub.
      - name: Send prices to bots
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: python notify.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
